[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Codechart"
version = "0.1.0"
description = "Converts code into a flowchart"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "cffi>=1.15.0",
]

[project.scripts]
code-to-flowchart = "src.python.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["python*"]